name: C++ application

on:
  push:
    branches: [master]
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.3'
          archives: qtbase
          cache: true
      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DMFG_BUILD_GUI=ON
      - name: Build
        run: cmake --build cpp/build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check deployment
        run: cmake --install cpp/build --config Release --prefix cpp/install

  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cmake -S cpp -B cpp/build-headless -DMFG_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build-headless --parallel 3
      - run: ctest --test-dir cpp/build-headless --output-on-failure
