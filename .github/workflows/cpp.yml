name: C++ application

on:
  push:
    branches: [master]
    paths: ['cpp/**', 'setup-windows.cmd', '.github/workflows/cpp.yml']
  pull_request:
    paths: ['cpp/**', 'setup-windows.cmd', '.github/workflows/cpp.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        if: runner.os != 'Linux'
        with:
          version: '6.8.3'
          archives: qtbase
          cache: true
      - name: Windows setup regression checks
        if: runner.os == 'Windows'
        shell: powershell
        run: ./cpp/tests/test_windows_setup.ps1
      - name: Windows setup, build, test, and deployment
        if: runner.os == 'Windows'
        shell: powershell
        run: ./cpp/scripts/setup-windows.ps1 -QtRoot $env:QT_ROOT_DIR -NoInstall -SkipEditor
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DMFG_BUILD_GUI=ON
      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build cpp/build --config Release --parallel 3
      - name: Test
        if: runner.os != 'Windows'
        run: ctest --test-dir cpp/build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check deployment
        if: runner.os != 'Windows'
        run: cmake --install cpp/build --config Release --prefix "${{ github.workspace }}/cpp/install"

  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cmake -S cpp -B cpp/build-headless -DMFG_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build cpp/build-headless --parallel 3
      - run: ctest --test-dir cpp/build-headless --output-on-failure
